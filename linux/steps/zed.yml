---
- defaults:
    shell:
      stdout: true
      stderr: true
      quiet: true
    link:
      create: true
      relink: true

- link:
    ~/.config/zed/settings.json: home/.config/zed/settings.json
    ~/.config/zed/keymap.json: home/.config/zed/keymap.json

- shell:
    - command: bash scripts/install_zed_tools
      description: Install Ansible tools and the Russian CSpell dictionary for Zed
