---
- defaults:
    shell:
      stdout: true
      stderr: true
      quiet: true
    link:
      create: true
      relink: true

- create:
    - ~/.ssh

- shell:
    - command: bash scripts/install_terminal linux
      description: Install missing shell tools without updating existing checkouts

- link:
    ~/.local/bin/vrg: home/.local/bin/vrg
    ~/.local/bin/clone_and_checkout_git_ssh: home/.local/bin/clone_and_checkout_git_ssh
    ~/.gitconfig: home/.gitconfig
    ~/.tmux.conf: home/.tmux.conf
    ~/.zshrc: home/.zshrc
    ~/.oh-my-zsh-custom: home/.oh-my-zsh-custom
    ~/.config/opencode/opencode.json: home/.config/opencode/opencode.json

    ~/.config/Cursor/User/snippets: home/.code_profiles/default/data/User/snippets
    ~/.config/Cursor/User/keybindings.json: home/.code_profiles/default/data/User/keybindings.json
    ~/.config/Cursor/User/settings.json: home/.code_profiles/default/data/User/settings.json
    ~/.config/Cursor/User/tasks.json: home/.code_profiles/default/data/User/tasks.json
