---
- defaults:
    shell:
      stdout: true
      stderr: true
      quiet: true

- shell:
    - command: |
        set -eu
        apt_packages=$(sed 's/#.*//; /^[[:space:]]*$/d' linux/packages.txt)
        sudo apt update
        printf '%s\n' "$apt_packages" | xargs -r sudo apt install -y
      description: Install packages from packages.txt
