---
- defaults:
    link:
      create: true
      relink: true

- link:
    ~/.config/Code/User/settings.json: home/.code_profiles/default/data/User/settings.json
    ~/.config/Code/User/keybindings.json: home/.code_profiles/default/data/User/keybindings.json
    ~/.config/Code/User/tasks.json: home/.code_profiles/default/data/User/tasks.json
    ~/.config/Code/User/snippets: home/.code_profiles/default/data/User/snippets

- shell:
    - command: bash scripts/install_vscode_extensions home/.code_profiles/default/extensions.txt
      description: Install VS Code extensions for the default profile
      stdout: true
      stderr: true
    - command: bash scripts/install_vscode_extensions home/.code_profiles/default/extensions.txt python
      description: Install default VS Code extensions for the python profile
      stdout: true
      stderr: true
    - command: bash scripts/install_vscode_extensions home/.code_profiles/python/extensions.txt python
      description: Install VS Code extensions for the python profile
      stdout: true
      stderr: true
