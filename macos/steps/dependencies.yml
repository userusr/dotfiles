---
- defaults:
    shell:
      stdout: true
      stderr: true
      quiet: true

# Installing dependencies:
- shell:
    - command: |
        set -e
        if brew list --versions ctags >/dev/null 2>&1; then
          brew unlink ctags
        fi
      description: Release legacy Ctags links before installing Universal Ctags

- brewfile:
    file: macos/Brewfile
    no-upgrade: true
    stdout: true
    stderr: true
    # You will need to install `cask` and `mas` deps
    # in a separate `brew bundle` call,
    # this is done because not everybody needs the same casks and apps,
    # but most of people would need the same formulas.
    include: ['tap', 'brew']
